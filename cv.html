<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayank Singh Kunwar · CV</title>
  <meta name="description" content="Printable CV of Mayank Singh Kunwar, Senior Backend Software Engineer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1d1d1f; --ink-2: #424245; --muted: #6e6e73; --line: #e5e5ea; --accent: #0066cc;
      --bg: #f5f5f7; --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .bar {
      position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 22px; background: rgba(245, 245, 247, 0.8); backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .bar a { color: var(--ink-2); }
    .bar button {
      font: inherit; font-weight: 500; border: 0; border-radius: 980px; padding: 8px 18px; cursor: pointer;
      background: #0071e3; color: #fff;
    }
    .bar button:hover { background: #0077ed; }

    .page {
      max-width: 860px; margin: 32px auto 64px; background: var(--paper); border-radius: 18px;
      padding: 56px clamp(22px, 6vw, 64px); box-shadow: 0 2px 30px rgba(0, 0, 0, 0.06);
    }
    header h1 { margin: 0; font-size: clamp(34px, 5vw, 46px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
    header .role { margin: 8px 0 14px; font-size: 19px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em; }
    header .contact { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-2); }
    header .rtw { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }
    header .rtw b { color: var(--ink); }

    h2 {
      margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    p { line-height: 1.6; margin: 0 0 10px; font-size: 15px; color: var(--ink-2); }
    .group { margin: 0 0 6px; }
    .group b { color: var(--ink); font-weight: 600; }

    .entry, .keep { break-inside: avoid; }
    .entry { margin: 0 0 22px; }
    .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .entry-head h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .entry-head .when { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .org { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; font-size: 15px; color: var(--ink-2); }
    .org img { height: 16px; width: auto; }
    ul { margin: 0; padding-left: 18px; }
    li { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-bottom: 4px; }
    li::marker { color: #a1a1a6; }

    @page { size: A4; margin: 14mm 14mm 16mm; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; padding: 0; max-width: none; box-shadow: none; border-radius: 0; }
      header h1 { font-size: 26pt; }
      header .role { font-size: 13pt; }
      h2 { margin-top: 18pt; }
      p, li, .org, header .contact, header .rtw { font-size: 10pt; }
      .entry-head h3 { font-size: 11pt; }
      .entry-head .when { font-size: 9.5pt; }
      a { color: var(--ink); }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="./">← Back to the story</a>
    <button type="button" onclick="window.print()">Download PDF</button>
  </div>
  <article class="page" id="cv"></article>

  <script src="data.js"></script>
  <script>
    (() => {
      const CV = window.CV, c = CV.contact || {};
      const esc = (s = '') => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      const logos = (st) => [].concat(st.logo || []).map((u) => `<img src="${esc(u)}" alt="">`).join('');
      const strip = (u) => u.replace(/^https?:\/\//, '');
      const entries = (type) => CV.stages.filter((s) => s.type === type).slice().reverse().map((s) => `
        <div class="entry">
          <div class="entry-head"><h3>${esc(s.title)}</h3><span class="when">${esc(s.period || '')}</span></div>
          <div class="org">${logos(s)}<span>${esc(s.org)}${s.location ? ' · ' + esc(s.location) : ''}</span></div>
          ${s.points && s.points.length ? `<ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        </div>`);
      // The heading travels with the first item so it never ends up alone at the bottom of a printed page
      const section = (title, items) => {
        items = [].concat(items).filter((x) => x && x.trim());
        return items.length ? `<div class="keep"><h2>${title}</h2>${items[0]}</div>${items.slice(1).join('')}` : '';
      };
      // Education entries in the PDF are one line each, so drop their bullets here too
      const education = CV.stages.filter((s) => s.type === 'education').slice().reverse().map((s) => `
        <div class="entry">
          <div class="entry-head"><h3>${esc(s.title)}</h3><span class="when">${esc(s.period || '')}</span></div>
          <div class="org">${logos(s)}<span>${esc(s.org)}${s.location ? ' · ' + esc(s.location) : ''}</span></div>
        </div>`);

      document.getElementById('cv').innerHTML = `
        <header>
          <h1>${esc(CV.name)}</h1>
          <p class="role">${esc(CV.title)}${CV.tagline ? ' · ' + esc(CV.tagline) : ''}</p>
          <div class="contact">
            ${c.location ? `<span>${esc(c.location)}</span>` : ''}
            ${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}
            ${c.linkedin ? `<a href="${esc(c.linkedin)}">${esc(strip(c.linkedin))}</a>` : ''}
            ${c.github ? `<a href="${esc(c.github)}">${esc(strip(c.github))}</a>` : ''}
            ${c.website ? `<a href="${esc(c.website)}">${esc(strip(c.website))}</a>` : ''}
          </div>
          ${CV.rightToWork ? `<p class="rtw"><b>Right to work:</b> ${esc(CV.rightToWork)}</p>` : ''}
        </header>
        ${section('Professional Summary', CV.summary ? `<p>${esc(CV.summary)}</p>` : '')}
        ${section('Technical Skills', (CV.skillGroups || []).map((g) => `<p class="group"><b>${esc(g.label)}:</b> ${g.items.map(esc).join(', ')}</p>`))}
        ${section('Professional Experience', entries('work'))}
        ${section('Research Project', entries('project'))}
        ${section('Education', education)}`;
    })();
  </script>
</body>
</html>
